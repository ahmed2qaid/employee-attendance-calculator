<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الدوام</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;color:#222}main{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 25px #0001}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}input,button{width:100%;padding:10px;box-sizing:border-box}button{background:#0d6efd;color:#fff;border:0;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{background:#fff;padding:15px;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}th{background:#212529;color:white}.friday{background:#eee}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h2>معاينة نظام الدوام</h2><div class="row"><label>من<input id="s" type="date" value="2026-07-26"></label><label>إلى<input id="e" type="date" value="2026-08-25"></label><div style="align-self:end"><button onclick="gen()">إنشاء الأيام</button></div></div></div><div class="stats"><div>إجمالي الحضور<h2 id="h">0س 0د</h2></div><div>أيام العمل المكافئة<h2 id="eq">0</h2></div><div>أيام الجمعة<h2 id="f">0</h2></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الحضور</th><th>الانصراف</th><th>الساعات</th><th>الأيام</th></tr></thead><tbody id="b"></tbody></table></div></main><script>const N=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];function D(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function I(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function gen(){let s=D(document.getElementById('s').value),e=D(document.getElementById('e').value),b=document.getElementById('b');b.innerHTML='';let f=0;for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){let k=I(d),fr=d.getDay()==5;if(fr)f++;let tr=document.createElement('tr');if(fr)tr.className='friday';tr.innerHTML=fr?`<td>${k}</td><td>الجمعة</td><td colspan="4">إجازة</td>`:`<td>${k}</td><td>${N[d.getDay()]}</td><td><input type="time" data-i="${k}" onchange="calc()"></td><td><input type="time" data-o="${k}" onchange="calc()"></td><td id="h${k}">—</td><td id="d${k}">—</td>`;b.appendChild(tr)}document.getElementById('f').textContent=f;calc()}function calc(){let t=0;document.querySelectorAll('[data-i]').forEach(i=>{let k=i.dataset.i,o=document.querySelector(`[data-o="${k}"]`).value;if(i.value&&o){let[a,b]=i.value.split(':').map(Number),[c,d]=o.split(':').map(Number),x=a*60+b,y=c*60+d;if(y<=x)y+=1440;let m=y-x;t+=m;document.getElementById('h'+k).textContent=Math.floor(m/60)+'س '+m%60+'د';document.getElementById('d'+k).textContent=(m/480).toFixed(6)}});document.getElementById('h').textContent=Math.floor(t/60)+'س '+t%60+'د';document.getElementById('eq').textContent=(t/480).toFixed(6)}gen()</script></body></html>
